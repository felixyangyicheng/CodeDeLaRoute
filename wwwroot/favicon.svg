<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="31" fill="url(#bg)" stroke="#4f46e5" stroke-width="2"/>
  <!-- Steering wheel outer ring -->
  <circle cx="32" cy="32" r="18" fill="none" stroke="#fbbf24" stroke-width="3.5"/>
  <!-- Steering wheel inner hub -->
  <circle cx="32" cy="32" r="5" fill="#fbbf24"/>
  <!-- Steering wheel spokes -->
  <line x1="32" y1="14" x2="32" y2="27" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="37" x2="32" y2="50" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <line x1="14" y1="32" x2="27" y2="32" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <line x1="37" y1="32" x2="50" y2="32" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <!-- Small decorative dots -->
  <circle cx="32" cy="32" r="2.5" fill="#6366f1"/>
</svg>
