# Cloudflare Pages configuration
# Ce fichier est utilisé par `wrangler pages deploy` ou par l'intégration GitHub → Cloudflare Pages
name = "code-de-la-route"
compatibility_date = "2025-05-14"

# Le dossier de sortie après `dotnet publish -c Release`
# Structure : publish/wwwroot/ contient les fichiers statiques finaux
pages_build_output_dir = "publish/wwwroot"

# Variables d'environnement (optionnel)
[vars]
APP_VERSION = "1.0.0"

# Headers de sécurité (optionnel, doublon de _headers mais plus explicite)
[headers]
  "/*.wasm" = { "Cache-Control" = "public, max-age=31536000, immutable" }
  "/*.dll" = { "Cache-Control" = "public, max-age=31536000, immutable" }
  "/_framework/*" = { "Cache-Control" = "public, max-age=31536000, immutable" }
  "/index.html" = { "Cache-Control" = "public, max-age=0, must-revalidate" }
  "/service-worker.js" = { "Cache-Control" = "public, max-age=0, must-revalidate" }
