name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore CodeDeLaRoute/CodeDeLaRoute.csproj

      - name: Publish Blazor WASM
        run: dotnet publish CodeDeLaRoute/CodeDeLaRoute.csproj -c Release -o publish

      - name: Prepare static output
        run: |
          mkdir -p static-output
          cp -r publish/wwwroot/* static-output/

      - name: Deploy to static branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./static-output
          publish_branch: static-deploy
          force_orphan: true
          commit_message: 'deploy: static build [skip ci]'
