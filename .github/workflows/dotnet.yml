# from https://github.com/ILoveDotNet/ilovedotnet/blob/main/.github/workflows/deployment.yml
name: build and test and deploy

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: '0 17 * * 0'
  workflow_dispatch:

env:
  TZ: Europe/Paris

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-test-deploy-blazor:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Install .NET WASM Build Tools
        run: dotnet workload install wasm-tools

      - name: Restore dependencies
        run: dotnet restore ./CodeDeLaRoute.csproj

      - name: Checking Vulnerable Nuget Packages
        run: |
          dotnet list ./CodeDeLaRoute.csproj package --vulnerable --include-transitive --format=json > list.json
          if jq -cre '.projects | .. | .severity? // empty | select(test("Critical|High"))' list.json; then
            echo 'Vulnerabilities found! Exiting...'
            jq . list.json
            exit 1
          else
            echo 'No vulnerabilities found!'
          fi

      - name: Checking Outdated Nuget Packages
        run: dotnet list ./CodeDeLaRoute.csproj package --outdated --include-transitive --format json

      - name: Checking Deprecated Nuget Packages
        run: dotnet list ./CodeDeLaRoute.csproj package --deprecated --include-transitive --format json

      - name: Build Blazor Project
        run: dotnet build ./CodeDeLaRoute.csproj --configuration Release --no-restore

      - name: Install .NET Report Generator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Publish Blazor Project
        run: dotnet publish CodeDeLaRoute.sln -c:Release -p:GHPages=true -o wwwroot --nologo

      - name: Fix publish output for GitHub Pages
        run: |
          # Blazor GHPages=true may create nested wwwroot/wwwroot/
          if [ -d ./wwwroot/wwwroot ]; then
            cp -r ./wwwroot/wwwroot/* ./wwwroot/ 2>/dev/null || true
            rm -rf ./wwwroot/wwwroot
            echo "Merged nested wwwroot/ to parent"
          fi
          # Replace #[.{fingerprint}] placeholder with actual boot loader filename
          BOOT_JS=$(find ./wwwroot/_framework -maxdepth 1 -name 'blazor.webassembly*.js' ! -name '*.br' ! -name '*.gz' 2>/dev/null | head -1)
          if [ -n "$BOOT_JS" ]; then
            BOOT_NAME=$(basename "$BOOT_JS")
            sed -i "s|_framework/blazor\.webassembly#\[\.{fingerprint}\]\.js|_framework/${BOOT_NAME}|g" ./wwwroot/index.html
            echo "Fixed boot loader: ${BOOT_NAME}"
          else
            echo "WARNING: blazor.webassembly JS not found"
          fi

      - name: touch 404.html & .nojekyll
        run: |
          touch ./wwwroot/.nojekyll
          cp ./wwwroot/index.html ./wwwroot/404.html
          echo "Dernière modification: $(date +"%Y-%m-%dT%I:%M:%pZ")" > ./wwwroot/README.md

      - name: Rewrite base href
        uses: SteveSandersonMS/ghaction-rewrite-base-href@v1.1.0
        with:
          html_path: ./wwwroot/index.html
          base_href: /

      - name: Setup Pages
        if: ${{ github.actor != 'dependabot[bot]' && github.event_name != 'pull_request' }}
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: ${{ github.actor != 'dependabot[bot]' && github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: './wwwroot'

      - name: Deploy to GitHub Pages
        if: ${{ github.actor != 'dependabot[bot]' && github.event_name != 'pull_request' }}
        id: deployment
        uses: actions/deploy-pages@v4
