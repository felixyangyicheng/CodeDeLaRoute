name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  TZ: Europe/Paris

permissions:
  contents: write

concurrency:
  group: "cloudflare-pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Install .NET WASM Build Tools
        run: dotnet workload install wasm-tools

      - name: Restore dependencies
        run: dotnet restore ./CodeDeLaRoute.csproj

      - name: Build Blazor Project
        run: dotnet build ./CodeDeLaRoute.csproj --configuration Release --no-restore

      - name: Publish Blazor Project
        run: dotnet publish ./CodeDeLaRoute.csproj -c Release -o publish --nologo

      - name: Verify build output
        run: |
          echo "=== wwwroot ==="
          ls publish/wwwroot/ | head -30
          echo ""
          echo "=== _framework ==="
          ls publish/wwwroot/_framework/ | head -20

      - name: Fix boot loader fingerprint placeholder
        run: |
          BOOT_JS=$(find ./publish/wwwroot/_framework -maxdepth 1 -name 'blazor.webassembly*.js' ! -name '*.br' ! -name '*.gz' 2>/dev/null | head -1)
          if [ -n "$BOOT_JS" ]; then
            BOOT_NAME=$(basename "$BOOT_JS")
            sed -i "s|_framework/blazor\.webassembly#\[\.{fingerprint}\]\.js|_framework/${BOOT_NAME}|g" ./publish/wwwroot/index.html
            echo "Fixed boot loader: ${BOOT_NAME}"
          fi

      - name: Rewrite base href
        uses: SteveSandersonMS/ghaction-rewrite-base-href@v1.1.0
        with:
          html_path: ./publish/wwwroot/index.html
          base_href: /

      - name: Deploy to cloudflare-pages branch
        run: |
          cp -r publish/wwwroot /tmp/cf-output
          cd /tmp/cf-output
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b cloudflare-pages
          git add .
          git commit -m "build: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" cloudflare-pages
